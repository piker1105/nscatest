<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凱曜股份有限公司 - 員工請款單產生器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @media print {
            @page { 
                margin: 0; 
                size: A4 landscape; 
            }
            body { 
                background: white !important; 
                margin: 0; 
                padding: 0;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                min-height: 100vh !important;
            }
            .print-hidden { display: none !important; }
            .print-block { display: block !important; }
            .print-w-full { width: 100% !important; }
            
            .printable-area {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 10mm !important;
            }
        }

        /* 讓手機上的預覽區可以滾動但保持比例 */
        .preview-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 隱藏 Chrome/Safari 的數字輸入箭頭 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [meta, setMeta] = useState({
                applicant: '',
                date: new Date().toISOString().split('T')[0],
                paymentMethod: 'transfer'
            });

            const initialItem = {
                id: Date.now(),
                date: new Date().toISOString().split('T')[0],
                dept: '運釀',
                category: '',
                client: '',
                projectId: '',
                projectName: '',
                description: '',
                amount: ''
            };

            const [items, setItems] = useState([initialItem]);

            useEffect(() => {
                const savedName = localStorage.getItem('applicant_name');
                if (savedName) setMeta(prev => ({ ...prev, applicant: savedName }));
            }, []);

            const handleMetaChange = (field, value) => {
                setMeta(prev => ({ ...prev, [field]: value }));
                if (field === 'applicant') localStorage.setItem('applicant_name', value);
            };

            const handleItemChange = (id, field, value) => {
                setItems(prev => prev.map(item => item.id === id ? { ...item, [field]: value } : item));
            };

            const addItem = () => {
                setItems([...items, { ...initialItem, id: Date.now(), date: meta.date }]);
            };

            const removeItem = (id) => {
                if (items.length === 1) return;
                setItems(items.filter(item => item.id !== id));
            };

            const totalAmount = items.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);

            const handlePrint = () => window.print();

            const handleDownloadCSV = () => {
                const headers = ['編號', '日期', '部門', '類別', '客戶別', '專案編號', '專案名稱', '內容/備註', '金額'];
                const rows = items.map((item, index) => [
                    index + 1,
                    item.date,
                    item.dept,
                    item.category,
                    item.client,
                    item.projectId,
                    item.projectName,
                    `"${(item.description || '').replace(/"/g, '""')}"`,
                    item.amount
                ]);

                const csvContent = [headers, ...rows].map(e => e.join(",")).join("\n");
                const blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `請款單_${meta.applicant || '未命名'}_${meta.date}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* 控制列 - 行動端優化 */}
                    <div className="bg-white shadow-sm border-b p-3 sm:p-4 print-hidden sticky top-0 z-10 flex flex-col sm:flex-row justify-between items-center gap-3">
                        <div className="flex items-center gap-2">
                            <h1 className="text-lg sm:text-xl font-bold text-blue-600">請款單產生系統</h1>
                        </div>
                        <div className="flex w-full sm:w-auto gap-2">
                            <button onClick={addItem} className="flex-1 sm:flex-none px-3 py-2 bg-green-50 text-green-700 rounded-lg hover:bg-green-100 border border-green-200 text-sm transition-colors">
                                + 新增
                            </button>
                            <button onClick={handleDownloadCSV} className="flex-1 sm:flex-none px-3 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 border border-gray-300 text-sm transition-colors">
                                💾 CSV
                            </button>
                            <button onClick={handlePrint} className="flex-1 sm:flex-none px-3 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-sm text-sm transition-colors">
                                🖨️ 列印/PDF
                            </button>
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row flex-1 overflow-hidden">
                        {/* 編輯區 - 行動端佔滿寬度 */}
                        <div className="w-full lg:w-1/3 p-4 sm:p-6 space-y-6 overflow-y-auto print-hidden">
                            <div className="bg-white p-4 sm:p-5 rounded-xl shadow-sm border border-gray-200">
                                <h2 className="text-lg font-semibold mb-4 border-b pb-2">1. 基本資料</h2>
                                <div className="grid gap-4">
                                    <div>
                                        <label className="text-xs text-gray-500 font-bold mb-1 block">請款人姓名</label>
                                        <input type="text" placeholder="請填寫姓名" value={meta.applicant} onChange={(e) => handleMetaChange('applicant', e.target.value)} className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs text-gray-500 font-bold mb-1 block">請款日期</label>
                                            <input type="date" value={meta.date} onChange={(e) => handleMetaChange('date', e.target.value)} className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm" />
                                        </div>
                                        <div>
                                            <label className="text-xs text-gray-500 font-bold mb-1 block">付款方式</label>
                                            <select value={meta.paymentMethod} onChange={(e) => handleMetaChange('paymentMethod', e.target.value)} className="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                                                <option value="cash">現金</option>
                                                <option value="transfer">轉帳</option>
                                                <option value="other">其他</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-white p-4 sm:p-5 rounded-xl shadow-sm border border-gray-200">
                                <h2 className="text-lg font-semibold mb-4 border-b pb-2">2. 消費明細</h2>
                                <div className="space-y-4">
                                    {items.map((item, idx) => (
                                        <div key={item.id} className="bg-gray-50 p-3 sm:p-4 rounded-lg border relative group">
                                            <button onClick={() => removeItem(item.id)} className="absolute top-2 right-2 text-gray-400 hover:text-red-500 p-1">✕</button>
                                            <div className="text-xs text-blue-500 font-bold mb-2">項次 {idx + 1}</div>
                                            <div className="grid grid-cols-2 gap-3 mb-3">
                                                <input type="date" value={item.date} onChange={(e) => handleItemChange(item.id, 'date', e.target.value)} className="p-1.5 text-sm border rounded" />
                                                <input type="number" value={item.amount} onChange={(e) => handleItemChange(item.id, 'amount', e.target.value)} className="p-1.5 text-sm border rounded font-mono" placeholder="金額" />
                                            </div>
                                            <div className="grid grid-cols-2 gap-3 mb-3">
                                                <input type="text" value={item.projectId} onChange={(e) => handleItemChange(item.id, 'projectId', e.target.value)} className="p-1.5 text-sm border rounded" placeholder="專案編號" />
                                                <select value={item.category} onChange={(e) => handleItemChange(item.id, 'category', e.target.value)} className="p-1.5 text-sm border rounded bg-white">
                                                    <option value="">選擇類別...</option>
                                                    <option value="餐飲">餐飲</option>
                                                    <option value="交通">交通/運送</option>
                                                    <option value="職工福利">職工福利</option>
                                                    <option value="文具">文具/消耗品</option>
                                                    <option value="設備">設備/維修</option>
                                                    <option value="應酬">應酬禮品</option>
                                                    <option value="其他">其他</option>
                                                </select>
                                            </div>
                                            <textarea value={item.description} onChange={(e) => handleItemChange(item.id, 'description', e.target.value)} className="w-full p-1.5 text-sm border rounded resize-none focus:ring-1 focus:ring-blue-400 outline-none" rows="2" placeholder="內容/備註" />
                                        </div>
                                    ))}
                                    <button onClick={addItem} className="w-full py-3 border-2 border-dashed border-gray-300 text-gray-500 rounded-lg hover:border-blue-400 hover:text-blue-600 transition-colors text-sm">
                                        + 新增一筆消費
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* 預覽區 - 行動端加入捲軸，保持比例 */}
                        <div className="w-full lg:w-2/3 bg-gray-200 p-4 sm:p-8 lg:p-12 overflow-auto print:p-0 print:bg-white print:overflow-visible">
                            <div className="preview-container flex justify-start lg:justify-center">
                                <div className="printable-area bg-white shadow-xl print:shadow-none min-w-[297mm] h-[210mm] p-[15mm] text-black box-border shrink-0 origin-top lg:origin-center scale-75 sm:scale-100 lg:scale-100">
                                    <div className="text-center mb-8">
                                        <h1 className="text-2xl font-bold tracking-widest mb-1">運釀股份有限公司</h1>
                                        <h2 className="text-xl font-medium border-b-2 border-black inline-block pb-1 px-4">員工請款單 Payment Request</h2>
                                    </div>

                                    <div className="flex justify-between items-end mb-6 text-sm">
                                        <div className="space-y-3 w-2/3">
                                            <div className="flex items-center"><span className="font-bold w-20">請款人：</span><span className="border-b border-black w-64 px-2">{meta.applicant}</span></div>
                                            <div className="flex items-center"><span className="font-bold w-20">總計金額：</span><span className="border-b border-black w-64 px-2 font-mono text-xl">{totalAmount.toLocaleString()}</span></div>
                                            <div className="flex gap-6 items-center">
                                                <span className="font-bold w-20">付款方式：</span>
                                                {['cash', 'transfer', 'other'].map(m => (
                                                    <label key={m} className="flex items-center gap-2 cursor-pointer"><span className="border border-black w-5 h-5 flex items-center justify-center text-xs">{meta.paymentMethod === m && '✓'}</span> {m === 'cash' ? '現金' : m === 'transfer' ? '轉帳' : '其他'}</label>
                                                ))}
                                            </div>
                                        </div>
                                        <div className="space-y-3 w-1/3 text-right">
                                            <div className="flex justify-end items-center"><span className="font-bold mr-2">付款日期：</span><span className="border-b border-black w-40 text-center">{meta.date}</span></div>
                                            <div className="flex justify-end items-center"><span className="font-bold mr-2">編號 Ref#：</span><span className="border-b border-black w-40 text-center bg-gray-50 print:bg-transparent h-6"></span></div>
                                            <div className="flex justify-end items-center mt-2"><label className="flex items-center gap-2"><span className="border border-black w-5 h-5"></span> 出帳查核</label></div>
                                        </div>
                                    </div>

                                    <table className="w-full border-collapse border border-black text-xs table-fixed mb-8">
                                        <thead>
                                            <tr className="bg-gray-100">
                                                <th className="border border-black p-2 w-[40px]">編號</th>
                                                <th className="border border-black p-2 w-[90px]">日期</th>
                                                <th className="border border-black p-2 w-[60px]">部門</th>
                                                <th className="border border-black p-2 w-[80px]">類別</th>
                                                <th className="border border-black p-2 w-[80px]">客戶別</th>
                                                <th className="border border-black p-2 w-[100px]">專案編號</th>
                                                <th className="border border-black p-2 w-[120px]">專案名稱</th>
                                                <th className="border border-black p-2">內容 / 備註</th>
                                                <th className="border border-black p-2 w-[90px]">金額</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {items.map((item, idx) => (
                                                <tr key={item.id} className="text-center align-middle h-10">
                                                    <td className="border border-black p-1">{idx + 1}</td>
                                                    <td className="border border-black p-1">{item.date}</td>
                                                    <td className="border border-black p-1">{item.dept}</td>
                                                    <td className="border border-black p-1">{item.category}</td>
                                                    <td className="border border-black p-1">{item.client}</td>
                                                    <td className="border border-black p-1 break-all">{item.projectId}</td>
                                                    <td className="border border-black p-1 break-all">{item.projectName}</td>
                                                    <td className="border border-black p-1 text-left whitespace-pre-wrap leading-tight">{item.description}</td>
                                                    <td className="border border-black p-1 text-right font-mono pr-2">{item.amount && Number(item.amount).toLocaleString()}</td>
                                                </tr>
                                            ))}
                                            {Array.from({ length: Math.max(0, 8 - items.length) }).map((_, idx) => (
                                                <tr key={idx} className="h-10">
                                                    <td className="border border-black p-1">{items.length + idx + 1}</td>
                                                    {Array(8).fill(null).map((_, i) => <td key={i} className="border border-black p-1"></td>)}
                                                </tr>
                                            ))}
                                            <tr className="font-bold bg-gray-50 print:bg-white text-base h-12">
                                                <td colSpan="8" className="border border-black p-2 text-center">總計 Total</td>
                                                <td className="border border-black p-2 text-right font-mono pr-2">{totalAmount.toLocaleString()}</td>
                                            </tr>
                                        </tbody>
                                    </table>

                                    <div className="flex justify-around mt-12 mb-6 text-sm px-12">
                                        <div className="w-1/4 border-b border-black pb-2">主管：</div>
                                        <div className="w-1/4 border-b border-black pb-2">財務：</div>
                                        <div className="w-1/4 border-b border-black pb-2">收款人：</div>
                                    </div>

                                    <div className="text-[11px] text-gray-500 mt-10 pt-4 border-t border-gray-200 leading-normal">
                                        <div className="flex gap-4">
                                            <span className="font-bold text-gray-700 whitespace-nowrap">分類備註：</span>
                                            <div className="space-y-1">
                                                <div><span className="font-bold">部門：</span>專案管理 / 企劃行銷 / 監測系統 / 營運行政 / 其他</div>
                                                <div><span className="font-bold">類別：</span>設備 / 郵資 / 消耗品 / 文具 / 清潔 / 維修 / 運送 / 應酬禮品 / ...</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
